name: exo2

on:
  push:

jobs:
    validate:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version: 24.18.0


        - uses: actions/cache@v5
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

        - run: npm ci
        - run: npm test

        - uses: actions/upload-artifact@v7
          with:
            name: build
            path : dist/
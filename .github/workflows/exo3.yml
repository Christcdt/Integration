name: Build_test

on:
  workflow_dispatch:

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version: 24.18.0

        - run: npm ci
        - run: npm build
        - run: |
            if [ ! -d "dist" ]; then
              echo "Le dossier dist n'existe pas."
              exit 1
            fi

        
        - uses: actions/upload-artifact@v7
          with:
            name: application
            path : dist/

        - run: |
            echo "## Build" >> "$GITHUB_STEP_SUMMARY" 
    
    test: 
      needs: build
      strategy:
        fail-fast: false
        max-parallel: 2
        matrix:
          node: [20.0.0, 22.0.0]
          os: [ubuntu-latest, windows-latest]

      runs-on: ${{ matrix.os }}

      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version: ${{ matrix.node }}

        - run: npm test
        - uses: actions/download-artifact@v7
          with:
            name: application
            path : dist/

    deploy:
      needs: test
      runs-on: ubuntu-latest
      environment: staging
      steps:
        - run: echo "Deploy to ${{ vars.API_URL }}" 